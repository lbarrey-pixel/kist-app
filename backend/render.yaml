services:
  - type: web
    name: kist-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SUPABASE_URL
        value: https://owpmcoithvzdlhmfkvbe.supabase.co
      - key: SUPABASE_KEY
        sync: false
